[package]
name = "rivet-codec"
version.workspace = true
edition.workspace = true
license-file = "LICENSE.md"
readme = "README.md"
repository.workspace = true
authors.workspace = true
description = "GPU video decode/encode dispatch (NVDEC/NVENC, AMF, QSV) plus colorspace, tonemap, audio, and probe for the rivet transcoder. Imported as `codec`."

[lib]
name = "codec"

[features]
# Default: no optional backend. The native H.264 / HEVC decoders and the
# software AV1 codecs are always compiled; the GPU tiers, openh264 and the
# software fallbacks are opt-in below. Everything ships from cargo.
#
# No FFmpeg, in any build. libavcodec was a software decode tier here twice
# (removed 2026-08-12, restored 2026-08-14 behind an `ffmpeg` feature, removed
# for good 2026-10-02): the project takes no dependency on FFmpeg at all, opt-in
# or not. Do not reintroduce it. What it decoded that nothing else does
# (ProRes) is not decoded; the native h26x decoders, the GPU tiers, openh264
# and rav1d cover the rest.
default = []

# `serde`: derive Serialize/Deserialize on the public value types that make
# sense to (de)serialize — currently `filter::VideoFilter` + `FilterSpec`, so a
# YAML/JSON DSL can express a filter chain as structured objects. Off by
# default (keeps the low-level crate lean); rivet's `batch`/`server` enable it.
serde = ["dep:serde"]

# `openh264-fallback`: software H.264, last resort.
#
# Behind the native h26x decoder, which comes first for H.264 and is broader;
# openh264 is only dependable on the profiles it handles well. It catches what
# the native decoder refuses, on a host with no GPU that takes the stream.
openh264-fallback = ["dep:openh264"]

# PLATFORM NOTE for the three GPU features below (`nvidia`, `amd`, `qsv`):
# they are this crate's own FFI, dlopening the vendor runtime at load time — no
# bindgen, no SDK header, no build-time link — so they build on both Windows
# MSVC and Linux. (They replaced the `shiguredo_*` crates, which bindgen'd the
# SDK headers and did not compile on Windows MSVC.) With a feature off, that
# hardware path compiles to a construction-erroring stub and the dispatcher
# just skips that tier.

# `lame`: MP3 encode (`audio::encode::mp3`) through LAME, loaded at run time
# with dlopen (`libmp3lame.so.0` / `libmp3lame.dylib` / `libmp3lame.dll`, or
# `RIVET_LAME_LIBRARY`) like the GPU runtimes: nothing is linked and nothing
# LGPL ships in the binary, and a build with it runs on a host without LAME
# until the first MP3 encode, which fails saying what to install. Off by
# default because it reaches for an LGPL library; MP3 *decoding* (minimp3)
# and MP3 muxing need no feature.
#   cargo build --features lame
lame = []

# `qsv`: Intel QSV AV1 encode via our own hand-rolled oneVPL FFI (`encode/qsv.rs`,
# 8-bit NV12 + 10-bit P010). dlopens libvpl.so.2 / libvpl.dll — no build-time
# link, no bindgen, no header, so it builds on **both Windows MSVC and Linux**.
# Intel Arc / Meteor Lake+.
#   cargo build --features qsv      (Windows or Linux)
qsv = []

# `nvidia`: NVENC AV1 encode + NVDEC decode via our own hand-rolled
# `nvEncodeAPI` / CUVID FFI (`encode/nvenc.rs`, `decode/nvdec.rs`). dlopens the
# NVIDIA runtime at load time — no build-time CUDA link, no bindgen, no header,
# so unlike the shiguredo crates it builds on **both Windows MSVC and Linux**.
# NVENC AV1 needs Ada+; NVDEC decodes H.264/HEVC/AV1/VP8/VP9/MPEG-2/MPEG-4 +
# 10-bit P016.
#   cargo build --features nvidia   (Windows or Linux)
nvidia = []

# `amd`: AMF AV1 encoder via our own hand-rolled AMF FFI (`encode/amf.rs`).
# dlopens amfrt64.dll / libamfrt64.so.1 — no build-time link, no bindgen, no
# header, so it builds on **both Windows MSVC and Linux**. AMD RDNA3+.
#   cargo build --features amd      (Windows or Linux)
amd = []

# `rav1e` / `rav1d`: software AV1, always COMPILED, gated for FALLBACK.
#
# Both implementations build unconditionally — they are pure Rust, need no SDK,
# no bindgen and no system library, so there is nothing to gate a build on and
# keeping them always-compiled means they are always testable and can always be
# asked for by name.
#
# What these features gate is narrower and is a policy decision: whether the
# dispatch chain **falls back** to software on its own when every hardware
# backend has declined. A throughput fleet wants that off — degrading silently
# into a CPU encoder one to two orders of magnitude slower looks like a capacity
# problem rather than the missing driver it is. A workstation, a CI runner or a
# GPU-less container wants it on, because a slow file beats a diagnostic.
#
# Named `-fallback` rather than after the crates: a Cargo feature may not share
# a name with a non-optional dependency, and the longer name says what is
# actually gated — the fallback, not the code.
#
#   cargo build --features rav1e-fallback,rav1d-fallback
rav1e-fallback = []
rav1d-fallback = []

# `h26x-fallback`: the same policy switch for this workspace's own software
# H.264 / H.265 ENCODERS (`crates/h26x`, `encode/h26x_sw.rs`). Like rav1e they
# are always compiled — pure Rust, no SDK, no system library — and this decides
# only whether the chain falls back to them when no hardware backend takes an
# H.264 / H.265 job. The matching DECODERS are not gated at all: they sit in
# the decode chain unconditionally, behind the hardware tiers.
#
#   cargo build --features h26x-fallback
h26x-fallback = []

# `rav1e-asm` / `rav1d-asm`: hand-written assembly kernels in the software
# codecs. Substantially faster, and they need **NASM** on the build host —
# which is why they are off by default. This crate's whole premise is that a
# `cargo build` needs no external toolchain, and an unconditional dependency
# that broke that for everybody would be a poor trade for a fallback path.
#
# Turn them on where the build environment is yours to control (a Docker image,
# a CI runner with nasm installed) and the fallback is expected to carry real
# load rather than merely exist.
#
#   apt-get install nasm   /   winget install NASM.NASM
#   cargo build --features rav1e-fallback,rav1e-asm
rav1e-asm = ["rav1e/asm"]
rav1d-asm = ["rav1d/asm"]

# `dpir`: the DEEP denoiser — `denoise=dpir[:SIGMA]` runs cszn/DPIR's DRUNet
# CNN on `candle` (pure Rust; the model weights are read straight from the
# upstream `.pth` release file, see `filter/dpir/`). Off by default because it
# adds a tensor library and a 130 MB model file that is downloaded once, and
# because a U-Net per frame is not a real-time filter on a CPU.
#
# `dpir-cuda` runs the same network on an NVIDIA GPU through candle's CUDA
# backend. Unlike the dlopen'd NVENC/NVDEC tiers this needs the CUDA toolkit
# (nvcc) at BUILD time — candle compiles its kernels — and on Windows an MSVC
# `cl.exe` on PATH (CUDA 13 also wants `NVCC_APPEND_FLAGS="-Xcompiler
# /Zc:preprocessor"`). `dpir-cudnn` adds cuDNN's convolution kernels: measured
# 3x faster again at 1080p (0.70 s/frame vs 2.2 s on an RTX 3090), and it
# needs `cudnn.lib` to link against and `cudnn64_9.dll` / `libcudnn.so.9` at
# run time.
#
#   cargo build --features dpir              (CPU)
#   cargo build --features dpir-cuda         (GPU)
#   cargo build --features dpir-cudnn        (GPU, cuDNN convolutions)
dpir = ["dep:candle-core", "dep:candle-nn"]
dpir-cuda = ["dpir", "candle-core/cuda", "candle-nn/cuda"]
dpir-cudnn = ["dpir-cuda", "candle-core/cudnn", "candle-nn/cudnn"]

[dependencies]
frame.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
libloading.workspace = true
# PNG decode for the `overlay` video filter (logo / watermark with alpha).
# png-only so the dep stays small — no other image format is pulled in.
image = { version = "0.25", default-features = false, features = ["png"] }

# mp4 crate is still needed by the container demuxer side.
mp4.workspace = true

# Audio codecs (Squad-24, Phase 2 audio expansion):
# - minimp3 (MIT) — MP3 decode wrapper around the minimp3 C library
# - lewton (MIT/Apache-2.0) — pure-Rust Vorbis decoder
# - audiopus (ISC) — high-level binding to libopus (BSD); for Opus encode
# - rubato (MIT) — sample-rate conversion for 44.1 → 48 kHz upsample
minimp3 = "0.5"
lewton = "0.10"
audiopus = "0.3.0-rc.0"
rubato = "0.15"
# No FFmpeg, in any build (see the note at the top of `[features]`). What it
# once provided is covered in-tree with no external toolchain:
#   decode  -> NVDEC / AMF / QSV (hand-rolled dlopen FFI, no SDK at build time),
#              the native h26x H.264 / HEVC decoders, openh264, rav1d for AV1
#   encode  -> NVENC / AMF / QSV, plus rav1e (AV1) and h26x (H.264 / H.265)
#   demux   -> this workspace's own MP4 / MKV / AVI / TS readers
#
# Do not reintroduce it. If a codec is missing, write one: a clean-room crate
# of its own in its own repository, brought in as a submodule (crates/h26x,
# crates/aac, crates/ac3, crates/dts, crates/lossless).

# Intel QSV is hand-rolled dlopen oneVPL FFI in-tree (encode/qsv.rs) — no
# external crate, builds on Windows + Linux. The shiguredo_vpl dep was retired
# (Windows MSVC); runtime still needs libvpl + the iHD VA-API driver on Linux.

# NVIDIA NVENC/NVDEC are hand-rolled dlopen FFI in-tree (encode/nvenc.rs,
# decode/nvdec.rs) — no external crate, builds on Windows + Linux. The
# shiguredo_nvcodec dep was retired (it doesn't compile on Windows MSVC).

# AMD AMF is hand-rolled dlopen FFI in-tree (encode/amf.rs) — no external crate,
# builds on Windows + Linux. The shiguredo_amf dep was retired (Windows MSVC).

# Software AV1, always compiled (see the `rav1e` / `rav1d` features for what is
# actually gated). Pure Rust, no system library, no bindgen, no SDK — they build
# anywhere the rest of the crate does, which is why they are unconditional deps.
openh264 = { version = "0.9", optional = true }

rav1e = { version = "0.8", default-features = false, features = ["threading"] }
# `default-features = false` drops `asm`, which requires NASM on the build host
# (see `rav1d-asm` above). The bit-depth features have to come back explicitly:
# they are not optional extras but the actual pixel implementations, and without
# them rav1d does not compile — its own `Grain` matches become non-exhaustive,
# which reads as a broken crate rather than a missing feature.
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

# Native H.264 / HEVC decode: this workspace's own decoders (`crates/h26x`).
# Pure Rust, no system library, no bindgen — always compiled, and always in
# the dispatch chain as the software tier for those two codecs (ahead of
# openh264, which then only catches what they refuse). `RIVET_DISABLE_H26X=1`
# takes it out at run time.
h26x.workspace = true

# AAC-LC encode and decode: this workspace's own codec (`crates/aac`, the
# rivet-aac repository). Pure Rust, no system library; `audio=aac` output
# and AAC input that has to be decoded (downmix, another codec) both go
# through it.
aac.workspace = true

# AC-3 / E-AC-3 decode: this workspace's own decoder (`crates/ac3`, the
# rivet-ac3 repository), written from ATSC A/52. Pure Rust, no system library.
ac3.workspace = true

# DTS core decode: this workspace's own decoder (`crates/dts`, the rivet-dts
# repository), written from ETSI TS 102 114. Pure Rust, no system library.
dts.workspace = true

# FLAC and ALAC, decode and encode: this workspace's own codecs
# (`crates/lossless`, the rivet-lossless repository), written from the format
# specifications. Pure Rust, no system library.
lossless.workspace = true

# Tensor library for the `dpir` deep denoiser (see the `dpir*` features).
# Pure Rust on the CPU path; the `cuda` feature compiles CUDA kernels with nvcc.
candle-core = { version = "0.11", optional = true, default-features = false }
candle-nn = { version = "0.11", optional = true, default-features = false }

# NVML (NVIDIA Management Library) wrapper. Used by the Phase 2
# (2026-05-07) richer worker_load surface to read per-GPU utilisation,
# encoder/decoder ASIC busy %, VRAM usage, and temperature on every
# 5 s load tick. NVML loads `libnvidia-ml.so` / `nvml.dll` lazily —
# init failure (no NVIDIA driver installed, hostless dev box) returns
# an Err that the caller folds to "all zeroes" without taking down
# the worker. Same dlopen-shaped runtime contract as the rest of the
# NVIDIA-tier code in this crate.
nvml-wrapper = { workspace = true }

[dev-dependencies]
container = { path = "../container", package = "rivet-container" }
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = "1"

[[bench]]
name = "colorspace"
harness = false

[[bench]]
name = "colorspace_601_to_709"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "bilinear"
harness = false

[[bench]]
name = "nvdec_decode"
harness = false

[[bench]]
name = "downsample_444_to_420"
harness = false

[lints.rust]
# `streaming_api_landed` is the post-merge gate flag for the
# streaming-migration #55 QA decoder regression tests
# (`tests/streaming_decoder_equality.rs`). Tests are compile-
# excluded on this branch; flipped on at integration time via
# `RUSTFLAGS="--cfg streaming_api_landed"`. Registering the cfg
# here silences the rust 1.80+ `unexpected_cfgs` warning.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(streaming_api_landed)'] }
