[package]
name = "rivet-transcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "LICENSE.md"
readme = "README.md"
repository.workspace = true
authors.workspace = true
description = "Modular GPU-accelerated video transcoding library, CLI, and HTTP/IPC service (AV1 + Opus, MP4/CMAF-HLS). Imported as `rivet`; CLI is `rivet`."

[lib]
name = "rivet"
path = "src/lib.rs"

[[bin]]
name = "rivet"
path = "src/main.rs"

[dependencies]
codec.workspace = true
container.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tokio.workspace = true
bytes.workspace = true
tempfile.workspace = true

# Hooks (`src/hooks/`): content digests for the built-in digest hook, and JSON
# for the event documents handed to exec / webhook hooks and the hook report.
# All permissively licensed and already in the dependency tree.
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.7"
serde_json = "1"

# Optional — only for the `thumbnail` feature. ravif wraps rav1e for AVIF
# still-image encode (reuses the AV1 codec story); rgb provides the pixel
# triplet type ravif consumes.
ravif = { version = "0.11", default-features = false, features = ["threading"], optional = true }
rgb = { version = "0.8", optional = true }

# Optional — only for the `image` feature (still images in and out; see
# `src/image/`). All permissively licensed:
# - image (MIT/Apache-2.0): pure-Rust JPEG / PNG / WebP / GIF / TIFF / BMP
#   decode and the PNG encoder. AVIF and HEIC are read by `src/image/heif.rs`
#   and decoded by the video decoders this workspace already has.
# - moxcms (BSD-3-Clause/Apache-2.0): pure-Rust ICC colour management, for
#   converting a tagged source (Display P3, Adobe RGB, ...) to sRGB.
# - jpeg-encoder (MIT/Apache-2.0): pure-Rust baseline/progressive JPEG with
#   4:2:0 chroma, optimised Huffman tables and an ICC segment.
# - webp (MIT/Apache-2.0) over libwebp-sys, which compiles Google's libwebp
#   (BSD-3-Clause) from vendored C with `cc` — no system library, no CMake. The
#   only lossy WebP encoder there is; image-webp encodes lossless only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"], optional = true }
moxcms = { version = "0.8", optional = true }
jpeg-encoder = { version = "0.7", optional = true }
webp = { version = "0.3", default-features = false, optional = true }

# Optional — only for the `server` feature: an HTTP transcode API so another
# application can signal rivet to transcode over the network.
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
glob = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
tempfile.workspace = true
# The crate's own HRD checker (`h26x::encode::hrd::verify`), for the HLS
# bitrate test: each segment must keep to the buffer it declares.
h26x.workspace = true
# Synthetic test sources (`tests/common/synth.rs`, `examples/synth_clip.rs`):
# MPEG-2 and DTS inputs made with this workspace's own encoders, so no
# external program makes a test input.
mpeg2.workspace = true
dts.workspace = true
# For the `server` feature's HTTP-layer integration test (ServiceExt::oneshot
# drives the router without binding a socket). Small; tests only.
tower = { version = "0.5", features = ["util"] }

[features]
default = []

# Forward the software codec tiers through to the codec crate. A feature only
# the inner crate exposes is a feature nobody can turn on: this is the crate a
# consumer depends on and the binary the CLI ships.
#
# Neither moves work off a GPU. They gate what happens when no hardware
# backend can be constructed, or when one declines a particular stream — see
# `crates/codec/Cargo.toml` for the ordering and why it is that way round.
openh264-fallback = ["codec/openh264-fallback"]

# Intel QSV AV1 encode via hand-rolled dlopen oneVPL FFI (no external crate;
# builds on Windows + Linux). Intel Arc / Meteor Lake+.
qsv = ["codec/qsv"]
# NVENC AV1 encode + NVDEC decode via hand-rolled dlopen FFI (no external
# crate; builds on Windows + Linux). NVENC AV1 needs NVIDIA Ada+.
nvidia = ["codec/nvidia"]
# AMF AV1 encode via hand-rolled dlopen FFI (no external crate; builds on
# Windows + Linux). AMD RDNA3+.
amd = ["codec/amd"]

# Software AV1 as a last-resort fallback, passed through to the codec crate.
# Reachable from here because this is the crate a consumer depends on and the
# binary the CLI ships — a feature only the inner crate exposes is a feature
# nobody can turn on.
#
# See `crates/codec/Cargo.toml` for what these gate: the implementations are
# always compiled, and these decide whether dispatch FALLS BACK to them when no
# hardware backend can be constructed.
rav1e-fallback = ["codec/rav1e-fallback"]
rav1d-fallback = ["codec/rav1d-fallback"]
# Software H.264 / H.265 encode on the workspace's own `h26x` crate, the same
# way: always compiled, this decides whether dispatch falls back to it.
h26x-fallback = ["codec/h26x-fallback"]

# Assembly kernels for the two software codecs. Faster, and they need NASM on
# the build host.
rav1e-asm = ["codec/rav1e-asm"]
rav1d-asm = ["codec/rav1d-asm"]
# Deep denoise (`--filter denoise=dpir:25`): DRUNet on candle. `dpir` is the
# CPU path, `dpir-cuda` the NVIDIA GPU path (needs nvcc at build time),
# `dpir-cudnn` the same with cuDNN convolutions. See crates/codec/Cargo.toml.
dpir = ["codec/dpir"]
dpir-cuda = ["codec/dpir-cuda"]
dpir-cudnn = ["codec/dpir-cudnn"]
# AVIF single-frame thumbnail capture (pulls ravif + rav1e — a heavy
# still-image encoder — so it is opt-in).
thumbnail = ["dep:ravif", "dep:rgb"]
# Still images (`mode=image`, `rivet image`): JPEG / PNG / WebP / AVIF / GIF /
# TIFF / BMP / HEIC in; AVIF / WebP / JPEG / PNG out, at several sizes; and
# stills from a video. Builds on `thumbnail` (the AVIF encoder and the frame
# capture). See docs/output-spec.md → Image output.
image = ["thumbnail", "dep:image", "dep:moxcms", "dep:jpeg-encoder", "dep:webp"]
# HTTP transcode API (`rivet serve`): an axum webserver that accepts media +
# an output spec and runs transcode jobs, so another application can signal
# rivet to transcode over the network. Pairs naturally with the hardware
# encode features (e.g. `--features server,nvidia`).
server = ["dep:axum", "dep:serde", "dep:uuid", "tokio/net", "codec/serde"]
# `rivet ipc`: a Unix-domain-socket server so a long-running app can stream
# media in and out without HTTP or temp files. Opt-in (Unix only at runtime; on
# Windows the command exists but reports use `pipe`/`serve`). The `pipe`
# stdin/stdout streaming path is always available and needs no feature.
ipc = []
# `rivet batch`: a YAML/JSON manifest DSL for converting many files in one run.
# Pulls serde + a YAML/JSON parser + glob. See docs/batch.md.
batch = ["dep:serde", "dep:serde_yaml_ng", "dep:glob", "codec/serde"]
