# rivet batch manifest — example. Run with: rivet batch examples/batch.yaml
# (build with `--features batch`). See docs/batch.md for the full DSL.
#
# Relative paths resolve against this file's directory.

output_dir: out            # base dir for jobs that omit `output`
on_error: continue         # continue (default) | stop

defaults:                  # applied to every job; any job can override per field
  crf: 28
  color: sdr               # tonemap HDR sources down to 8-bit SDR
  audio: auto              # AAC/Opus passthrough, MP3/Vorbis -> Opus

jobs:
  # 1) a single file -> a single MP4, with a per-job quality override
  - input: in/movie.mkv
    output: out/movie.mp4
    crf: 24

  # 2) one file -> a segmented HLS package (a directory) with an ABR ladder
  - input: in/promo.mov
    output: out/promo        # directory = HLS asset root
    mode: hls
    ladder: true
    max_short_side: 1080
    segment_seconds: 6       # segment length IS GOP length here — the encoder is
                             # forced to an IDR at every boundary, so this trades
                             # seek granularity against keyframe cost

  # 3) a glob -> one job per match; each file -> out/<name>.mp4 (trailing slash)
  - input: "clips/*.mp4"
    output: out/
    crf: 30

  # 4) scale a single output + force HDR10 (needs a 10-bit encoder)
  - input: in/hdr_source.mov
    output: out/hdr_720p.mp4
    width: 1280
    height: 720
    color: hdr10

  # 5) video filters as structured objects (crop centred, mirror, rotate).
  #    Equivalent string form: filter: "crop=1280:720,hflip,rotate=90"
  - input: in/phone_clip.mov
    output: out/phone_fixed.mp4
    width: 720
    height: 1280
    filter:
      - crop:
          w: 1280
          h: 720           # x/y optional → centred
      - hflip
      - rotate: 90

  # 6) an explicit rung list instead of the derived ladder, and H.265 output
  #    for players that cannot do AV1. Rungs are WxH — a bare short side is
  #    rejected, because a rung has an aspect ratio and the manifest is not the
  #    place to guess one.
  - input: in/lecture.mp4
    output: out/lecture
    mode: hls
    codec: h265
    rungs: ["1920x1080", "1280x720", "854x480"]
    bit_depth: 10bit       # H.265 only; H.264 is 8-bit

  # 7) choosing GPUs — encode and decode are chosen separately, because they
  #    are not distributed the same way. Encode spreads across every card the
  #    policy allows; decode always runs on exactly ONE, since a decoder is a
  #    serial dependency chain. See docs/engine.md, "Which GPUs do what".
  - input: in/big_source.mxf
    output: out/big
    mode: hls
    ladder: true
    gpu_family: nvidia     # encode on the NVIDIA cards only…
    decode_gpu: 0          # …and pump frames off GPU 0 specifically
    max_fps: 30            # drop frames above this rather than encoding them

  # 8) pin everything to one card. `single_gpu` also takes the serial
  #    single-file encode path, with no chunk-stitch overhead — worth it when
  #    the host has one GPU anyway, or when you are reproducing a bitstream.
  - input: in/reference.mov
    output: out/reference.mp4
    single_gpu: true
    gpu: 1
    seam: serial           # one encoder for the whole file, flat seams

# Per-rung encode tuning (softer small rungs, sharper top rung, tile grids,
# reference frames, lookahead) is a *library* API rather than a manifest field —
# see `RungPolicy` in docs/codec-encode.md, "Per-rung tuning". It is not
# expressible here yet, and inventing keys for it that the parser rejects would
# be worse than saying so.
